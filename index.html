<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mapa das Folhas</title>
  
  <!-- Leaflet CSS & Fontes -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mensagem Toast -->
  <div id="toast" class="toast-box">Notificação</div>

  <!-- Topo: Busca e Filtros -->
  <header class="top-bar">
    <div class="brand-pill">
      <span>🌿 MAPA DAS FOLHAS</span>
      <span class="badge-count" id="count-label">0</span>
    </div>

    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="search-input" placeholder="Buscar folha...">
    </div>

    <div class="filter-row">
      <button type="button" class="filter-chip active" data-filter="all">Todos</button>
      <button type="button" class="filter-chip" data-filter="movimentado">🌙 Após 00h</button>
      <button type="button" class="filter-chip" data-filter="qualquer_horario">🕐 Qualquer horário</button>
    </div>
  </header>

  <!-- Mapa 100% Tela Cheia -->
  <div id="map"></div>
  <button type="button" class="btn-gps" id="btn-gps" title="Minha Localização">📍</button>

  <!-- Telas Sobrepostas (Folhas e Ajustes) -->
  <section class="overlay-screen" id="screen-leaves">
    <h2 class="screen-title">Minhas Plantas</h2>
    <div id="leaves-container"></div>
  </section>

  <section class="overlay-screen" id="screen-settings">
    <h2 class="screen-title">Configurações</h2>
    <button type="button" class="btn-outline" id="btn-export">📥 Fazer Backup dos Dados (JSON)</button>
    <button type="button" class="btn-danger" id="btn-clear-all" style="margin-top: 10px;">🗑️ Limpar Todos os Registros</button>
  </section>

  <!-- Barra de Navegação Inferior -->
  <nav class="bottom-nav">
    <button type="button" class="nav-btn active" data-tab="map">🗺️ Mapa</button>
    <button type="button" class="nav-btn" data-tab="add" id="nav-btn-add">＋ Adicionar</button>
    <button type="button" class="nav-btn" data-tab="leaves">🌿 Folhas</button>
    <button type="button" class="nav-btn" data-tab="settings">⚙️ Ajustes</button>
  </nav>

  <!-- Modal Bottom Sheet: Cadastro / Edição -->
  <div class="sheet-overlay" id="sheet-form">
    <div class="bottom-sheet">
      <div class="drag-pill"></div>
      <div class="sheet-header">
        <h3 class="sheet-title" id="form-title">Nova Folha</h3>
        <button type="button" class="close-circle" id="form-close">✕</button>
      </div>

      <input type="hidden" id="f-id">
      <input type="hidden" id="f-lat">
      <input type="hidden" id="f-lng">

      <div class="form-group">
        <label class="form-lbl">Nome da Folha / Planta *</label>
        <input type="text" id="f-name" class="pill-input" placeholder="Ex: Arruda, Guiné, Alecrim">
      </div>

      <div class="form-group">
        <label class="form-lbl">Foto</label>
        <input type="file" id="f-file" accept="image/*" style="display:none;">
        <div class="photo-box" id="photo-box">
          <span id="photo-txt">📷 Toque para adicionar foto</span>
          <img id="photo-img" style="display:none;" alt="Prévia">
        </div>
      </div>

      <div class="form-group">
        <label class="form-lbl">Localização</label>
        <div class="loc-switcher">
          <button type="button" class="loc-btn active" id="tab-loc-gps">📍 GPS / Mapa</button>
          <button type="button" class="loc-btn" id="tab-loc-addr">✍️ Endereço</button>
        </div>

        <div class="loc-panel" id="panel-gps">
          <div style="display:flex; gap:6px;">
            <button type="button" class="btn-outline" id="btn-get-gps" style="flex:1;">📍 Meu GPS</button>
            <button type="button" class="btn-outline" id="btn-pick-map" style="flex:1;">🗺️ No Mapa</button>
          </div>
          <div id="lbl-gps-status" class="status-text">Ponto automático definido no centro do mapa</div>
        </div>

        <div class="loc-panel" id="panel-addr" style="display:none;">
          <input type="text" id="f-address" class="pill-input" placeholder="Ex: Rua das Flores, 120">
          <button type="button" class="btn-outline" id="btn-search-addr">🔍 Buscar Endereço</button>
          <div id="lbl-addr-status" class="status-text">Digite e clique em buscar para localizar.</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-lbl">Horário de Retirada</label>
        <div class="choice-grid">
          <button type="button" class="choice-card" id="card-night">
            <span style="font-size: 1.1rem;">🌙</span>
            <span>Após 00h</span>
          </button>
          <button type="button" class="choice-card selected" id="card-day">
            <span style="font-size: 1.1rem;">🕐</span>
            <span>Qualquer horário</span>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-lbl">Observações</label>
        <textarea id="f-obs" class="pill-textarea" placeholder="Ex: Ao lado do portão, muro alto..."></textarea>
      </div>

      <button type="button" class="btn-lime" id="btn-save">Salvar Planta</button>
      <button type="button" class="btn-danger" id="btn-form-delete" style="display:none;">🗑️ Apagar Esta Planta</button>
    </div>
  </div>

  <!-- Modal Bottom Sheet: Detalhes da Planta -->
  <div class="sheet-overlay" id="sheet-details">
    <div class="bottom-sheet">
      <div class="drag-pill"></div>
      <div class="sheet-header">
        <h3 class="sheet-title" id="det-name">Nome</h3>
        <button type="button" class="close-circle" id="det-close">✕</button>
      </div>

      <div class="det-photo-container">
        <img id="det-img" alt="Foto da Planta">
      </div>

      <div id="det-badge" class="badge-time">Qualquer horário</div>
      <div id="det-addr" class="det-addr-text"></div>
      <div id="det-obs" class="det-obs-box"></div>

      <button type="button" class="btn-lime" id="det-route">🧭 Rota no Google Maps</button>
      <div style="display:flex; gap:6px; margin-top:6px;">
        <button type="button" class="btn-outline" id="det-edit" style="flex:1;">✏️ Editar</button>
        <button type="button" class="btn-danger" id="det-delete" style="flex:1; margin:0;">🗑️ Apagar</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
