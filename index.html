<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mapa das Folhas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1013;
      --card: #ffffff;
      --text: #111418;
      --muted: #64748b;
      --input: #f1f5f9;
      --lime: #cbf30e;
      --danger-bg: #fee2e2;
      --danger: #dc2626;
      --pill: 9999px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); }
    #map { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }
    .top-bar { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 500; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
    .top-bar > * { pointer-events: auto; }
    .brand-pill { background: rgba(15,16,19,0.92); padding: 5px 12px; border-radius: var(--pill); color: #fff; font-weight: 800; font-size: 0.78rem; display: inline-flex; align-items: center; gap: 6px; width: fit-content; border: 1px solid rgba(255,255,255,0.15); }
    .badge-count { background: var(--lime); color: #000; font-size: 0.7rem; padding: 2px 7px; border-radius: var(--pill); font-weight: 800; }
    .search-box { background: #fff; border-radius: var(--pill); padding: 6px 14px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
    .search-box input { border: none; outline: none; width: 100%; font-size: 0.85rem; font-weight: 600; font-family: inherit; }
    .filter-row { display: flex; gap: 6px; overflow-x: auto; }
    .filter-chip { background: rgba(15,16,19,0.85); color: #fff; padding: 5px 12px; border-radius: var(--pill); font-size: 0.72rem; font-weight: 700; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; white-space: nowrap; transition: 0.2s; font-family: inherit; }
    .filter-chip.active { background: var(--lime); color: #000; border-color: var(--lime); font-weight: 800; }
    .btn-gps { position: fixed; right: 14px; bottom: 80px; z-index: 500; width: 44px; height: 44px; border-radius: 50%; background: #fff; border: none; box-shadow: 0 4px 14px rgba(0,0,0,0.3); font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .bottom-nav { position: fixed; bottom: 10px; left: 12px; right: 12px; background: rgba(255,255,255,0.96); border-radius: var(--pill); padding: 4px; display: flex; justify-content: space-between; align-items: center; z-index: 600; box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
    .nav-btn { flex: 1; border: none; background: transparent; padding: 9px 6px; border-radius: var(--pill); font-size: 0.76rem; font-weight: 700; color: var(--muted); cursor: pointer; transition: 0.2s; font-family: inherit; }
    .nav-btn.active { background: var(--lime); color: #000; font-weight: 800; box-shadow: 0 2px 8px rgba(203,243,14,0.5); }
    .overlay-screen { position: fixed; inset: 0; background: #fff; z-index: 550; display: none; flex-direction: column; overflow-y: auto; padding: 16px 14px 80px; }
    .overlay-screen.active { display: flex; }
    .plant-card { background: var(--input); border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: none; align-items: flex-end; justify-content: center; }
    .sheet-overlay.active { display: flex; }
    .bottom-sheet { background: #fff; width: 100%; max-width: 480px; border-radius: 24px 24px 0 0; padding: 12px 16px 22px; max-height: 86vh; overflow-y: auto; }
    .drag-pill { width: 32px; height: 4px; background: #cbd5e1; border-radius: var(--pill); margin: 0 auto 8px; }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .close-circle { width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--input); font-size: 0.85rem; cursor: pointer; color: var(--muted); }
    .form-group { margin-bottom: 9px; }
    .form-lbl { font-size: 0.68rem; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-bottom: 3px; display: block; }
    .p-input { width: 100%; background: var(--input); border: 1px solid transparent; border-radius: var(--pill); padding: 8px 12px; font-size: 0.84rem; font-weight: 600; outline: none; font-family: inherit; }
    .p-textarea { width: 100%; background: var(--input); border: 1px solid transparent; border-radius: 14px; padding: 8px 12px; font-size: 0.82rem; outline: none; resize: none; min-height: 44px; font-family: inherit; }
    .switch-grid { display: grid; grid-template-columns: 1fr 1fr; background: var(--input); border-radius: var(--pill); padding: 2px; gap: 3px; margin-bottom: 5px; }
    .switch-btn { border: none; background: transparent; padding: 7px; border-radius: var(--pill); font-size: 0.72rem; font-weight: 700; color: var(--muted); cursor: pointer; transition: 0.2s; font-family: inherit; }
    .switch-btn.active { background: var(--lime); color: #000; font-weight: 800; }
    .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .choice-card { background: var(--input); border: 2px solid transparent; border-radius: 12px; padding: 8px; text-align: center; cursor: pointer; font-size: 0.74rem; font-weight: 700; transition: 0.2s; font-family: inherit; }
    .choice-card.selected { background: var(--lime); border-color: #000; color: #000; font-weight: 800; }
    .btn-lime { width: 100%; background: var(--lime); color: #000; border: none; padding: 11px; border-radius: var(--pill); font-size: 0.88rem; font-weight: 800; cursor: pointer; box-shadow: 0 3px 10px rgba(203,243,14,0.4); font-family: inherit; }
    .btn-out { width: 100%; background: #fff; border: 1px solid #cbd5e1; padding: 7px; border-radius: var(--pill); font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: inherit; }
    .btn-del { width: 100%; background: var(--danger-bg); color: var(--danger); border: none; padding: 9px; border-radius: var(--pill); font-size: 0.82rem; font-weight: 700; cursor: pointer; margin-top: 6px; font-family: inherit; }
    .photo-box { width: 100%; height: 85px; border-radius: 14px; background: var(--input); border: 1px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; font-size: 0.74rem; color: var(--muted); font-weight: 600; }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; }
    .leaf-pin { background: #fff; border: 2px solid #000; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; box-shadow: 0 3px 8px rgba(0,0,0,0.3); position: relative; }
    .leaf-pin span { position: absolute; top: -3px; right: -3px; width: 12px; height: 12px; border-radius: 50%; background: var(--lime); border: 1px solid #000; display: flex; align-items: center; justify-content: center; font-size: 6px; font-weight: 800; }
    .toast-box { position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-70px); background: #0f1013; color: #fff; padding: 6px 16px; border-radius: var(--pill); font-size: 0.76rem; font-weight: 700; z-index: 3000; transition: 0.25s; pointer-events: none; }
    .toast-box.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div id="toast" class="toast-box">Notificação</div>

  <div class="top-bar">
    <div class="brand-pill"><span>🌿 MAPA DAS FOLHAS</span><span class="badge-count" id="count-label">0</span></div>
    <div class="search-box"><span>🔍</span><input type="text" id="search-input" placeholder="Buscar folha..." oninput="renderMap()"></div>
    <div class="filter-row">
      <button class="filter-chip active" onclick="setFilter('all', this)">Todos</button>
      <button class="filter-chip" onclick="setFilter('movimentado', this)">🌙 Após 00h</button>
      <button class="filter-chip" onclick="setFilter('qualquer_horario', this)">🕐 Qualquer horário</button>
    </div>
  </div>

  <div id="map"></div>
  <button class="btn-gps" onclick="getGPS(true)">📍</button>

  <div class="overlay-screen" id="screen-leaves">
    <h2 style="font-size:1.15rem;font-weight:800;margin-bottom:10px;">Minhas Plantas</h2>
    <div id="leaves-container"></div>
  </div>

  <div class="overlay-screen" id="screen-settings">
    <h2 style="font-size:1.15rem;font-weight:800;margin-bottom:10px;">Configurações</h2>
    <button class="btn-out" onclick="exportData()">📥 Fazer Backup (JSON)</button>
    <button class="btn-del" onclick="clearAllData()">🗑️ Limpar Todos os Registros</button>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="tab-map" onclick="navTo('map')">🗺️ Mapa</button>
    <button class="nav-btn" id="tab-add" onclick="openForm(null)">＋ Adicionar</button>
    <button class="nav-btn" id="tab-leaves" onclick="navTo('leaves')">🌿 Folhas</button>
    <button class="nav-btn" id="tab-settings" onclick="navTo('settings')">⚙️ Ajustes</button>
  </nav>

  <!-- MODAL FORM -->
  <div class="sheet-overlay" id="sheet-form">
    <div class="bottom-sheet">
      <div class="drag-pill"></div>
      <div class="sheet-header">
        <h3 style="font-size:1.1rem;font-weight:800;" id="form-title">Nova Folha</h3>
        <button class="close-circle" onclick="closeSheets()">✕</button>
      </div>

      <input type="hidden" id="f-id">
      <input type="hidden" id="f-lat">
      <input type="hidden" id="f-lng">

      <div class="form-group">
        <label class="form-lbl">Nome da Folha / Planta *</label>
        <input type="text" id="f-name" class="p-input" placeholder="Ex: Arruda, Guiné, Alecrim">
      </div>

      <div class="form-group">
        <label class="form-lbl">Foto</label>
        <input type="file" id="f-file" accept="image/*" style="display:none;" onchange="handlePhoto(event)">
        <div class="photo-box" onclick="document.getElementById('f-file').click()">
          <span id="photo-txt">📷 Toque para adicionar foto</span>
          <img id="photo-img" style="display:none;" alt="">
        </div>
      </div>

      <div class="form-group">
        <label class="form-lbl">Localização</label>
        <div class="switch-grid">
          <button class="switch-btn active" id="loc-tab-gps" onclick="switchLocTab('gps')">📍 GPS / Mapa</button>
          <button class="switch-btn" id="loc-tab-addr" onclick="switchLocTab('addr')">✍️ Endereço</button>
        </div>

        <div id="panel-gps" style="display:flex;flex-direction:column;gap:5px;">
          <div style="display:flex;gap:6px;">
            <button class="btn-out" onclick="getGPS(false)" style="flex:1;">📍 Meu GPS</button>
            <button class="btn-out" onclick="pickOnMap()" style="flex:1;">🗺️ No Mapa</button>
          </div>
          <div id="lbl-gps-st" style="font-size:.7rem;color:var(--muted);text-align:center;">Local automático pronto</div>
        </div>

        <div id="panel-addr" style="display:none;flex-direction:column;gap:5px;">
          <input type="text" id="f-address" class="p-input" placeholder="Ex: Rua das Flores, 100, São Paulo">
          <button class="btn-out" onclick="searchAddr()">🔍 Buscar Endereço</button>
          <div id="lbl-addr-st" style="font-size:.7rem;color:var(--muted);text-align:center;">Digite e busque.</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-lbl">Horário de Retirada</label>
        <div class="choice-grid">
          <button class="choice-card" id="card-night" onclick="setTimeType('movimentado')">🌙 Após 00h</button>
          <button class="choice-card selected" id="card-day" onclick="setTimeType('qualquer_horario')">🕐 Qualquer horário</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-lbl">Observações</label>
        <textarea id="f-obs" class="p-textarea" placeholder="Ex: Próximo à calçada, muro baixo..."></textarea>
      </div>

      <button class="btn-lime" onclick="savePlant()">Salvar Planta</button>
      <button class="btn-del" id="btn-del-form" style="display:none;" onclick="deleteCurrent()">🗑️ Apagar Esta Planta</button>
    </div>
  </div>

  <!-- MODAL DETALHES -->
  <div class="sheet-overlay" id="sheet-det">
    <div class="bottom-sheet">
      <div class="drag-pill"></div>
      <div class="sheet-header">
        <h3 style="font-size:1.1rem;font-weight:800;" id="det-name">Nome</h3>
        <button class="close-circle" onclick="closeSheets()">✕</button>
      </div>
      <div id="det-img-box" style="height:115px;border-radius:14px;overflow:hidden;background:#e2e8f0;margin-bottom:6px;display:none;">
        <img id="det-img" style="width:100%;height:100%;object-fit:cover;" alt="">
      </div>
      <div id="det-badge" style="display:inline-block;background:var(--lime);color:#000;padding:2px 8px;border-radius:var(--pill);font-size:.68rem;font-weight:800;margin-bottom:4px;"></div>
      <div id="det-addr" style="font-size:.74rem;color:var(--muted);margin-bottom:4px;"></div>
      <div id="det-obs" style="background:var(--input);padding:8px 10px;border-radius:10px;font-size:.78rem;margin-bottom:8px;"></div>
      <button class="btn-lime" onclick="openRoute()">🧭 Rota no Google Maps</button>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <button class="btn-out" onclick="editCurrent()" style="flex:1;">✏️ Editar</button>
        <button class="btn-del" onclick="deleteCurrent()" style="flex:1;margin:0;">🗑️ Apagar</button>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const KEY = 'mapa_folhas_store_v9';
    let plants = JSON.parse(localStorage.getItem(KEY)) || [];
    let map, markers, userLoc = null, activeFilter = 'all', activeType = 'qualquer_horario';
    let photoData = '', currentPlant = null, isPicking = false;

    window.onload = function() {
      map = L.map('map', { zoomControl: false }).setView([-23.5505, -46.6333], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      markers = L.layerGroup().addTo(map);

      setTimeout(() => map.invalidateSize(), 300);
      window.onresize = () => map.invalidateSize();

      map.on('click', e => {
        if (isPicking) {
          isPicking = false;
          setCoords(e.latlng.lat, e.latlng.lng, `🗺️ ${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`);
          openForm(currentPlant);
        }
      });

      getGPS(false);
      renderMap();
      updateBadge();
    };

    function toast(m) {
      const t = document.getElementById('toast');
      t.innerText = m;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function navTo(tab) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.querySelectorAll('.overlay-screen').forEach(s => s.classList.remove('active'));

      if (tab === 'leaves') {
        renderLeavesList();
        document.getElementById('screen-leaves').classList.add('active');
      } else if (tab === 'settings') {
        document.getElementById('screen-settings').classList.add('active');
      } else {
        map.invalidateSize();
      }
    }

    function setFilter(f, btn) {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = f;
      renderMap();
    }

    function switchLocTab(t) {
      document.getElementById('loc-tab-gps').classList.toggle('active', t === 'gps');
      document.getElementById('loc-tab-addr').classList.toggle('active', t === 'addr');
      document.getElementById('panel-gps').style.display = t === 'gps' ? 'flex' : 'none';
      document.getElementById('panel-addr').style.display = t === 'addr' ? 'flex' : 'none';
    }

    function setTimeType(t) {
      activeType = t;
      document.getElementById('card-night').classList.toggle('selected', t === 'movimentado');
      document.getElementById('card-day').classList.toggle('selected', t === 'qualquer_horario');
    }

    function getGPS(center) {
      if (!navigator.geolocation) { fallbackCoords(); return; }
      navigator.geolocation.getCurrentPosition(p => {
        userLoc = { lat: p.coords.latitude, lng: p.coords.longitude };
        setCoords(userLoc.lat, userLoc.lng, `📍 GPS: ${userLoc.lat.toFixed(4)}, ${userLoc.lng.toFixed(4)}`);
        if (center) { map.setView([userLoc.lat, userLoc.lng], 16); toast('Localização atualizada'); }
      }, () => { fallbackCoords(); }, { enableHighAccuracy: true });
    }

    function fallbackCoords() {
      const c = map.getCenter();
      setCoords(c.lat, c.lng, `Ponto no centro: ${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}`);
    }

    function setCoords(lat, lng, txt) {
      document.getElementById('f-lat').value = lat;
      document.getElementById('f-lng').value = lng;
      document.getElementById('lbl-gps-st').innerText = txt;
    }

    function pickOnMap() {
      isPicking = true;
      closeSheets();
      toast('Toque em qualquer ponto do mapa');
    }

    function searchAddr() {
      const q = document.getElementById('f-address').value.trim();
      const st = document.getElementById('lbl-addr-st');
      if (!q) return alert('Digite um endereço');
      st.innerText = 'Buscando...';
      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`)
        .then(r => r.json())
        .then(d => {
          if (d && d.length) {
            const lat = parseFloat(d[0].lat), lon = parseFloat(d[0].lon);
            setCoords(lat, lon, `📍 ${lat.toFixed(4)}, ${lon.toFixed(4)}`);
            st.innerText = 'Localizado!';
            map.setView([lat, lon], 16);
            toast('Endereço encontrado');
          } else { st.innerText = 'Não encontrado'; }
        }).catch(() => { st.innerText = 'Erro na busca'; });
    }

    function handlePhoto(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const cvs = document.createElement('canvas');
          let w = img.width, h = img.height, max = 400;
          if (w > h && w > max) { h = Math.round((h * max) / w); w = max; }
          else if (h > max) { w = Math.round((w * max) / h); h = max; }
          cvs.width = w; cvs.height = h;
          cvs.getContext('2d').drawImage(img, 0, 0, w, h);
          photoData = cvs.toDataURL('image/jpeg', 0.65);
          showPhotoPreview(photoData);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function showPhotoPreview(src) {
      const img = document.getElementById('photo-img');
      const txt = document.getElementById('photo-txt');
      if (src) { img.src = src; img.style.display = 'block'; txt.style.display = 'none'; }
      else { img.style.display = 'none'; txt.style.display = 'block'; }
    }

    function openForm(item) {
      closeSheets();
      currentPlant = item;
      document.getElementById('form-title').innerText = item ? 'Editar Folha' : 'Nova Folha';
      document.getElementById('f-id').value = item ? item.id : '';
      document.getElementById('f-name').value = item ? item.name : '';
      document.getElementById('f-obs').value = item ? (item.obs || '') : '';
      document.getElementById('f-address').value = item ? (item.address || '') : '';
      document.getElementById('btn-del-form').style.display = item ? 'block' : 'none';

      setTimeType(item ? item.type : 'qualquer_horario');
      photoData = item ? (item.photo || '') : '';
      showPhotoPreview(photoData);

      if (item) setCoords(item.lat, item.lng, `📍 ${item.lat.toFixed(4)}, ${item.lng.toFixed(4)}`);
      else fallbackCoords();

      switchLocTab('gps');
      document.getElementById('sheet-form').classList.add('active');
    }

    function closeSheets() {
      document.querySelectorAll('.sheet-overlay').forEach(s => s.classList.remove('active'));
    }

    function savePlant() {
      const name = document.getElementById('f-name').value.trim();
      let lat = parseFloat(document.getElementById('f-lat').value);
      let lng = parseFloat(document.getElementById('f-lng').value);
      const obs = document.getElementById('f-obs').value.trim();
      const addr = document.getElementById('f-address').value.trim();
      const id = document.getElementById('f-id').value;

      if (!name) return alert('Informe o nome da folha');
      if (isNaN(lat) || isNaN(lng)) {
        const c = map.getCenter();
        lat = c.lat; lng = c.lng;
      }

      if (id) {
        const idx = plants.findIndex(x => x.id === id);
        if (idx !== -1) plants[idx] = { id, name, lat, lng, obs, address: addr, type: activeType, photo: photoData };
      } else {
        plants.push({ id: 'f_' + Date.now(), name, lat, lng, obs, address: addr, type: activeType, photo: photoData });
      }

      localStorage.setItem(KEY, JSON.stringify(plants));
      closeSheets();
      renderMap();
      updateBadge();
      navTo('map');
      map.setView([lat, lng], 16);
      toast('Planta salva com sucesso!');
    }

    function deleteCurrent() {
      if (!currentPlant || !confirm('Deseja apagar esta planta?')) return;
      plants = plants.filter(x => x.id !== currentPlant.id);
      localStorage.setItem(KEY, JSON.stringify(plants));
      closeSheets();
      renderMap();
      updateBadge();
      if (document.getElementById('screen-leaves').classList.contains('active')) renderLeavesList();
      toast('Planta apagada');
    }

    function editCurrent() {
      const item = currentPlant;
      closeSheets();
      openForm(item);
    }

    function renderMap() {
      markers.clearLayers();
      const q = document.getElementById('search-input').value.trim().toLowerCase();

      plants.forEach(item => {
        if (activeFilter !== 'all' && item.type !== activeFilter) return;
        if (q && !item.name.toLowerCase().includes(q)) return;

        const icon = L.divIcon({
          className: '',
          html: `<div class="leaf-pin">🌿<span>${item.type === 'movimentado' ? '🌙' : '🕐'}</span></div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });

        const m = L.marker([item.lat, item.lng], { icon }).addTo(markers);
        m.on('click', () => openDetails(item));
      });
    }

    function openDetails(item) {
      closeSheets();
      currentPlant = item;
      document.getElementById('det-name').innerText = item.name;

      const imgBox = document.getElementById('det-img-box');
      const img = document.getElementById('det-img');
      if (item.photo) { img.src = item.photo; imgBox.style.display = 'block'; }
      else { imgBox.style.display = 'none'; }

      document.getElementById('det-badge').innerText = item.type === 'movimentado' ? '🌙 Após 00h' : '🕐 Qualquer horário';
      document.getElementById('det-addr').innerText = item.address ? `📍 ${item.address}` : `📍 ${item.lat.toFixed(4)}, ${item.lng.toFixed(4)}`;
      document.getElementById('det-obs').innerText = item.obs || 'Sem observações.';
      document.getElementById('sheet-det').classList.add('active');
    }

    function openRoute() {
      if (!currentPlant) return;
      const origin = userLoc ? `${userLoc.lat},${userLoc.lng}` : '';
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${currentPlant.lat},${currentPlant.lng}${origin ? `&origin=${origin}` : ''}`, '_blank');
    }

    function renderLeavesList() {
      const c = document.getElementById('leaves-container');
      c.innerHTML = '';
      if (!plants.length) {
        c.<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>javascript
        c.innerHTML = '<div style="font-size:0.8rem; color:var(--muted); padding:10px 0;">Nenhuma planta cadastrada ainda.</div>';
        return;
      }
      plants.forEach(item => {
        const card = document.createElement('div');
        card.className = 'plant-card';
        card.innerHTML = `
          <div>
            <strong>${item.name}</strong>
            <div style="font-size:0.72rem; color:var(--muted);">${item.type === 'movimentado' ? '🌙 Após 00h' : '🕐 Qualquer horário'}</div>
          </div>
          <span style="font-weight:800; font-size:1rem;">➔</span>
        `;
        card.onclick = () => {
          navTo('map');
          map.setView([item.lat, item.lng], 16);
          openDetails(item);
        };
        c.appendChild(card);
      });
    }

    function updateBadge() {
      document.getElementById('count-label').innerText = plants.length;
    }

    function exportData() {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(plants, null, 2)], { type: 'application/json' }));
      a.download = `folhas-backup.json`;
      a.click();
    }

    function clearAllData() {
      if (confirm('Deseja realmente apagar todos os registros?')) {
        plants = [];
        localStorage.removeItem(KEY);
        closeSheets();
        renderMap();
        updateBadge();
        toast('Todos os registros foram apagados');
      }
    }
  </script>
</body>
